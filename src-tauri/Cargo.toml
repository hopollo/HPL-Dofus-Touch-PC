[package]
name = "hpl-dofus-touch-pc"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# custom-protocol: serve the bundled setup page in every build (no dev server)
tauri = { version = "2", features = ["custom-protocol"] }
serde_json = "1"
percent-encoding = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
